# Core stack: Postgres + Rails API. No optional Python ML or extra API services—faster startup.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whynot
      POSTGRES_PASSWORD: whynot
      POSTGRES_DB: whynot_development
    ports:
      - "5432:5432"
    volumes:
      - whynot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whynot -d whynot_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ruby:3.3-bookworm
    working_dir: /rails
    volumes:
      - .:/rails
    ports:
      - "3002:3002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=whynot
      - DATABASE_PASSWORD=whynot
      - DATABASE_NAME=whynot_development
      - RAILS_ENV=development
      - PORT=3002
      - PIDFILE=/tmp/puma-whynot.pid
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-docker_dev_jwt_secret_change_me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3002,http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends libpq-dev build-essential &&
        bundle install &&
        rm -rf tmp/cache/bootsnap &&
        bundle exec rails db:prepare &&
        rm -f tmp/pids/server.pid &&
        bundle exec rails server -b 0.0.0.0 -p 3002
      "

volumes:
  whynot_pgdata:
